# Keyword rules for suggesting an entry's ATA chapter, category and ACS
# subject areas from its description (EntrySuggester).
#
# Matching: whole words or phrases, case-insensitive; a space also matches a
# hyphen ("tie down" = "tie-down"); a trailing * matches any ending
# (rivet* = rivet, rivets, riveted). Longer phrases are matched first and
# use up their words, so "oil filter" doesn't also count as "oil" and
# "filter", and "brake cylinder" isn't an engine cylinder. Mentioning a
# keyword again adds weight (up to three times).
#
# Weights: 5 names one system unmistakably, 4 strongly, 3 usually,
# 2 ambiguous, 1 weak hint, 0.5 a shop practice that accompanies any job
# (torque, safety wire, hoses): it adds its ACS area but only decides the
# chapter when nothing else is mentioned.
#
# The technician's own past entries also vote (similar descriptions vote for
# the chapters they used). test/models/entry_suggester_corpus_test.rb holds
# realistic entries and their expected chapters: run it after editing.

# Default category and ACS areas for each chapter. Codes are from
