# Keyword rules for suggesting an entry's ATA chapter, category and ACS
# subject areas from its description (EntrySuggester). Each keyword is
# matched as a whole word or phrase, case-insensitively; a trailing * matches
# any ending (rivet* = rivet, rivets, riveted). Weights add up per chapter.
# The technician's own past entries also count (similar descriptions vote
# for the chapters they used).

